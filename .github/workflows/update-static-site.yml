name: Update static site data

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
  schedule:
    - cron: "0 21 */5 * *"

permissions:
  contents: write

jobs:
  update:
    if: github.event_name != 'push' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Rebuild static site
        run: node build-static.mjs

      - name: Test website SEO and chatbot failover
        run: node --test

      - name: Commit updated data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update portfolio data"
          file_pattern: "index.html index.template.html 404.html robots.txt sitemap.xml hakkimda/index.html projeler/index.html hizmetler/index.html assets/img/services/* cache/*.json"
